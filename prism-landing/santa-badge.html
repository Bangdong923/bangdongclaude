<style>
  .prism-santa{
    --santa-color: #1c2030;               /* 실루엣 색 */
    --santa-opacity: .3;                  /* 실루엣 진하기 (0~1, 그림자 느낌은 .2~.4) */
    --santa-width: 230px;                 /* 크기 */
    --santa-top: 76px;                    /* 위에서부터 거리 */
    --santa-right: 40px;                  /* 오른쪽에서부터 거리 */
    position: fixed; top: var(--santa-top); right: var(--santa-right);
    width: var(--santa-width); z-index: 50; pointer-events: none;
    color: var(--santa-color);
    animation: ps-float 6s ease-in-out infinite;
  }
  .prism-santa svg{ display: block; width: 100%; height: auto; overflow: visible; }
  .prism-santa .ps-sil{ opacity: var(--santa-opacity); }
  .prism-santa .ps-deer{ animation: ps-bob 1.4s ease-in-out infinite; }
  .prism-santa .ps-d2{ animation-delay: -.7s; }
  .prism-santa .ps-nose{ fill: #e8293b; filter: drop-shadow(0 0 3px rgba(232, 41, 59, .9)); animation: ps-nose 1.8s ease-in-out infinite; }
  /* 달이 필요 없으면 바로 아래 줄 앞뒤의 주석 기호를 지우세요 */
  /* .prism-santa .ps-moon{ display: none; } */
  @keyframes ps-float{ 0%,100%{ transform: translate(0, 0) rotate(-2deg); } 50%{ transform: translate(-8px, -10px) rotate(1.5deg); } }
  @keyframes ps-bob{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-1.6px); } }
  @keyframes ps-nose{ 0%,100%{ opacity: 1; } 50%{ opacity: .5; } }
  @media (max-width: 600px){ .prism-santa{ --santa-width: 140px; --santa-top: 60px; --santa-right: 12px; } }
  @media (prefers-reduced-motion: reduce){ .prism-santa, .prism-santa *{ animation: none !important; } }
