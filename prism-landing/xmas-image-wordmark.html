<!-- ============================================================
  PRISM 크리스마스 트리 글씨 (이미지 + 반짝이는 전구)
  준비물: prism-xmas.webp 파일을 이 페이지와 같은 폴더에 두기
  1) 아래 <style> ~ </style> 를 <head> 안(또는 </body> 바로 위)에 붙여넣기
  2) 기존 PRISM 제목(<h1>PRISM</h1>)을 아래 <h1 class="xmas-word"> ~ </h1> 로 통째로 바꾸기
  - 이미지 경로가 다르면 src="prism-xmas.webp" 만 실제 경로로 바꾸세요
  - 크기는 .xmas-word 의 width 값으로 조절합니다
  - 전구 위치는 이미지에 맞춰 계산된 값이라 이미지를 바꾸면 다시 맞춰야 합니다
============================================================ -->

.xmas-word{position:relative;margin:0;width:clamp(300px,46vw,620px);line-height:0}
.xmas-word img{display:block;width:100%;height:auto}
.xmas-bulbs{position:absolute;inset:0;pointer-events:none}
.xmas-bulbs i{
  position:absolute;width:4.4%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,hsla(var(--h),100%,88%,.95) 0,hsla(var(--h),100%,62%,.55) 28%,hsla(var(--h),100%,55%,0) 68%);
  mix-blend-mode:screen;opacity:.15;
  animation:xmas-bulb var(--t,2.6s) ease-in-out var(--d,0s) infinite;
}
@keyframes xmas-bulb{0%,100%{opacity:.12}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.xmas-bulbs i{animation:none;opacity:.5}}
